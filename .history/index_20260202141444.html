<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orçamento Numerado</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>

  <body>
    <header>
       <img src="./assets/img/logo1.png" alt="logoEmpresa">
    </header>

   <div class="container">

    <div>
        <small id="diaSemana"></small>
    </div>  

    <h1>ORÇAMENTO</h1>

   <div class="orcamento-topo">
        <div>
            <div id="numeroOrcamento" class="numero-orcamento"></div>
        </div>
    </div>


    <div class="responsive-table">
      <table class="tabela-orcamento">>
        <thead>
            <tr>
                <th>QT</th>
                <th>DESCRIÇÃO</th>
                <th>Vlr.Unit</th>
                <th>TOTAL</th>
            </tr>
        </thead>

        <tbody id="itens">
            <tr>
                <td><input type="text" class="input-box desc" placeholder="Item"></td>
                <td><input type="number" class="input-box qtd" value="0" onchange="calcularTabela()"></td>
                <td><input type="number" class="input-box valor" value="0.00" step="0.01" onchange=""></td>
                <td class="totalItem">R$ 0,00</td>
            </tr>
            <tr>
                <td><input type="number" class="qt" min="0" oninput="calcularTotais()"></td>
                <td><input type="text" class="desc"></td>
                <td><input type="number" class="vl" step="0.01" min="0" oninput="calcularTotais()"></td>
                <td class="totalItem">R$ 0,00</td>
            </tr>
            <tr>
                <td><input type="number" class="qt" min="0" oninput="calcularTotais()"></td>
                <td><input type="text" class="desc"></td>
                <td><input type="number" class="vl" step="0.01" min="0" oninput="calcularTotais()"></td>
                <td class="totalItem">R$ 0,00</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2"></td>
                <td class="total-label">TOTAL:</td>
                <td id="totalGeral">R$ 0,00</td>
            </tr>
        </tfoot>
    </table>
</div>


<script src="script.js"></script>
</body>
</html>

    <script src="./assets/js/main.js"></script>
  </body>
</html>

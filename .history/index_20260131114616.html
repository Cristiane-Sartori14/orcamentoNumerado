<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orçamento Numerado</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>

  <body>
    <header>
       <img src="./assets/img/logo1.png" alt="logoEmpresa">
    </header>

   <div class="container">

    <div>
        <small id="diaSemana"></small>
    </div>  

    <h1>ORÇAMENTO</h1>

   <div class="orcamento-topo">
        <div>
            <div id="numeroOrcamento" class="numero-orcamento"></div>
        </div>
    </div>


    <div class="responsive-table">
      <table class="tabela-orcamento">>
        <thead>
            <tr>
                <th>QT</th>
                <th>DESCRIÇÃO</th>
                <th>Vlr.Unit</th>
                <th>TOTAL</th>
            </tr>
        </thead>
        
     <tbody id="itens">
            <tr>
                <td><input type="number" class="qt" min="0"></td>
                <td><input type="text" class="desc"></td>
                <td><input type="number" class="vl" step="0.01" min="0"></td>
                <td class="totalItem">0,00</td>
            </tr>
            <tr>
                <td><input type="number" class="qt" min="0"></td>
                <td><input type="text" class="desc"></td>
                <td><input type="number" class="vl" step="0.01" min="0"></td>
                <td class="totalItem">0,00</td>
            </tr>
            <tr>
                <td><input type="number" class="qt" min="0"></td>
                <td><input type="text" class="desc"></td>
                <td><input type="number" class="vl" step="0.01" min="0"></td>
                <td class="totalItem">0,00</td>
            </tr>
        </tbody>
    </table>

        <div class="total-box">
            Total Geral: R$ <span id="totalGeral">0,00</span>
        </div>  
    </div>
  
<script src="script.js"></script>
</body>
</html>

    <script src="./assets/js/main.js"></script>
  </body>
</html>
